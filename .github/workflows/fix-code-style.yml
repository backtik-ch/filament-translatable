name: fix-code-style

on:
  push:
    paths:
      - '**.php'

permissions:
  contents: write

jobs:
  fix-code-style:
    runs-on: ${{ fromJSON(vars.RUNNER) }}
    steps:
      # persist-credentials: true is required so `git-auto-commit-action` below
      # can push the reformatted files back to the branch.
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.2 # zizmor: ignore[artipacked]

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 8.4

      - name: Install dependencies
        run: composer install --no-interaction --no-scripts

      - name: Run Pint
        run: ./vendor/bin/pint

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: Fix styling
